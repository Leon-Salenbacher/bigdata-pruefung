services:
  # ========================================
  # XKCD Downloader
  # ========================================
  xkcd-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      XKCD_BASE_URL: "https://xkcd.com"
      XKCD_REQUEST_TIMEOUT: "15"
      XKCD_REQUEST_DELAY: "0.3"
      XKCD_MAX_RETRIES: "3"
      XKCD_START_ID: "1"
      XKCD_END_ID: "0"
      XKCD_RAW_DIR: "/app/data/raw"
    volumes:
      - "./data/raw:/app/data/raw"
    restart: "no"
    profiles: ["download"]

  # ========================================
  # Hadoop HDFS NameNode
  # ========================================
  hdfs-init:
    image: apache/hadoop:3.4.3
    user: "0:0"
    entrypoint: ["bash", "-c"]
    command: ["chown -R 1000:100 /hdfs/name /hdfs/data"]
    volumes:
      - namenode_data:/hdfs/name
      - datanode_data:/hdfs/data
    restart: "no"

  namenode:
    image: apache/hadoop:3.4.3
    hostname: namenode
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    command: ["bash", "/opt/xkcd/boot_namenode.sh"]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.namenode.name.dir: "file:///tmp/hadoop-root/dfs/name"
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - type: bind
        source: ./scripts/boot_namenode.sh
        target: /opt/xkcd/boot_namenode.sh
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  # ========================================
  # Hadoop HDFS DataNode
  # ========================================
  datanode:
    image: apache/hadoop:3.4.3
    hostname: datanode
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
    command: ["hdfs", "datanode"]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.datanode.data.dir: "file:///tmp/hadoop-root/dfs/data"
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
    restart: unless-stopped

  # ========================================
  # XKCD HDFS Import
  # ========================================
  hdfs-import:
    image: apache/hadoop:3.4.3
    command: ["bash", "/opt/xkcd/import_hdfs.sh"]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      XKCD_HDFS_RAW_DIR: "/user/hadoop/xkcd/raw"
      XKCD_LOCAL_RAW_DIR: "/data/raw"
    volumes:
      - "./data/raw:/data/raw:ro"
      - "./scripts/import_hdfs.sh:/opt/xkcd/import_hdfs.sh:ro"
    profiles: ["tools"]
    restart: "no"
    depends_on:
      - namenode
      - datanode
  
  # ========================================
  # XKCD PySpark Transformation
  # ========================================
  xkcd-transform:
    image: apache/spark:3.5.7-python3
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: 
      - "--master"
      - "local[2]"
      - "--conf"
      - "spark.driver.memory=1g"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      - "/opt/xkcd/transform.py"
    environment:
      XKCD_HDFS_RAW_DIR: "hdfs://namenode:8020/user/hadoop/xkcd/raw"
      XKCD_HDFS_FINAL_DIR: "hdfs://namenode:8020/user/hadoop/xkcd/final"
    volumes:
      - "./scripts/transform.py:/opt/xkcd/transform.py:ro"
    depends_on:
      - namenode
      - datanode
    profiles: ["tools"]
    restart: "no"

  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:17
    hostname: postgres
    environment:
      POSTGRES_USER: xkcd
      POSTGRES_PASSWORD: xkcd_dev_password
      POSTGRES_DB: xkcd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/merge_comics.sql:/opt/xkcd/merge_comics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xkcd -d xkcd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ========================================
  # XKCD PostgreSQL Export
  # ========================================
  xkcd-postgres-export:
    image: apache/spark:3.5.7-python3
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[2]"
      - "--packages"
      - "org.postgresql:postgresql:42.7.4"
      - "--conf"
      - "spark.jars.ivy=/tmp/.ivy2"
      - "/opt/xkcd/export_postgres.py"
    environment:
      XKCD_HDFS_FINAL_DIR: "hdfs://namenode:8020/user/hadoop/xkcd/final"
      POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/xkcd"
      POSTGRES_USER: "xkcd"
      POSTGRES_PASSWORD: "xkcd_dev_password"
    volumes:
      - ./scripts/export_postgres.py:/opt/xkcd/export_postgres.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    profiles: ["tools"]
    restart: "no"

  # ========================================
  # Backend - XKCD Search API
  # ========================================
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql://xkcd:xkcd_dev_password@postgres:5432/xkcd"
    ports:
      - "127.0.0.1:8000:8000"
    profiles: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ========================================
  # Frontend
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    profiles: ["web"]
    depends_on:
      - backend
    restart: unless-stopped

  # ========================================
  # ETL-Tool | Airflow
  # ========================================
  airflow:
    build:
      context: ./airflow
    image: xkcd-airflow:3.1.0
    command: standalone
    profiles: ["airflow"]
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_data:/opt/airflow
      - .:/opt/xkcd-project:ro
      - /var/run/docker.sock:/var/run/docker.sock

# ========================================
# Persistent Volumes
# ========================================
volumes:
  airflow_data:
  namenode_data:
  datanode_data:
  postgres_data:
